name: SoulLink CI

on:
  push:
    branches: [ soullink ]
  pull_request:
    branches: [ soullink ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SoulLink sentinel (上游挂钩不得丢失)
        run: |
          set -e
          check() {
            grep -qF "$2" "$1" || {
              echo "❌ 挂钩丢失：$3"
              echo "   文件：$1"
              echo "   找不到：$2"
              exit 1
            }
          }
          check app/src/main/java/me/rerere/rikkahub/service/ChatService.kt \
                "GameLedgerHooks.onTurnFinished" "M1 回合结束钩子"
          check app/src/main/java/me/rerere/rikkahub/data/repository/ConversationRepository.kt \
                "gameSessionId = conversation.gameSessionId" "gameSessionId 写入映射"
          check app/src/main/java/me/rerere/rikkahub/data/repository/ConversationRepository.kt \
                "gameSessionId = conversationEntity.gameSessionId" "gameSessionId 读取映射"
          check app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt \
                "loadedCompiledInjections" "世界书接线"
          check app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt \
                "attachWorldbook" "世界书挂载"
          echo "✅ 5 个挂钩全在"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 占位 Firebase 配置（单一事实源：ci/google-services.placeholder.json）
      - name: Provide placeholder google-services.json
        run: cp ci/google-services.placeholder.json app/google-services.json

      - name: Unit tests (game module)
        run: |
          chmod +x gradlew
          ./gradlew :game:test --stacktrace --console=plain

      - name: Unit tests (worldbook mapper)
        run: ./gradlew :app:testGithubDebugUnitTest --tests "me.rerere.rikkahub.data.game.*" --stacktrace --console=plain

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug --stacktrace --console=plain

      # T2：KSP 只生成当前版本的 schema，必须入库，否则迁移链断档
      - name: Room schema drift check
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "❌ schema 有未提交变更："
            git status --porcelain -- app/schemas
            exit 1
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      - name: Extract Kotlin errors
        if: always()
        run: |
          echo "===== Kotlin 错误行 ====="
          grep -hE "^e: " -r . --include="*.log" 2>/dev/null || echo "（无）"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soullink-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
