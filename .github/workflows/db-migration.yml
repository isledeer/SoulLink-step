name: DB Migration Test

on:
  push:
    branches: [ soullink ]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/db/**'
      - 'app/src/androidTest/**'
      - 'app/schemas/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - run: cd web-ui && pnpm install --frozen-lockfile
      - name: Provide placeholder google-services.json
        run: cp ci/google-services.placeholder.json app/google-services.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedGithubDebugAndroidTest --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
